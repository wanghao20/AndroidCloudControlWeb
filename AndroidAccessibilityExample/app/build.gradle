plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.wanghaonetcn.Accessibility'
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.wanghaonetcn.Accessibility"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            storeFile file('test.jks')
            storePassword 'testtest'
            keyAlias 'test'
            keyPassword 'testtest'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField("String", "BUILD_TIME", "\"" + new Date().toString() + "\"")
            signingConfig signingConfigs.release
        }
        debug {
            buildConfigField("String", "BUILD_TIME", "\"" + new Date().toString() + "\"")
            signingConfig signingConfigs.release
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    compileOptions {
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
        }
    }
}

dependencies {
    implementation 'com.github.mik3y:usb-serial-for-android:3.4.3'
    implementation 'de.robv.android.xposed:api:82'
    implementation 'de.robv.android.xposed:api:82:sources'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.4.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'org.java-websocket:Java-WebSocket:1.5.4'
    implementation 'androidx.room:room-runtime:2.4.2'
    kapt 'androidx.room:room-compiler:2.4.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'io.reactivex.rxjava3:rxjava:3.0.6'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation 'com.squareup.retrofit2:adapter-rxjava3:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.0.0'
    implementation 'me.codeboy.android:align-text-view:2.3.2'
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'commons-codec:commons-codec:1.16.0'
}

task createKeystore {
    doLast {
        def keytoolPath = "${System.getProperty('java.home')}/bin/keytool"
        if (System.getProperty('os.name').toLowerCase().contains('windows')) {
            keytoolPath += ".exe"
        }
        exec {
            commandLine keytoolPath, '-genkey', '-v', '-keystore', 'test.jks', '-alias', 'test', '-keyalg', 'RSA', '-keysize', '2048', '-validity', '10000', '-storepass', 'testtest', '-keypass', 'testtest', '-dname', 'CN=test, OU=test, O=test, L=test, ST=test, C=test'
        }
    }
}

