<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>账号管理 - 群控平台</title>
  <link rel="stylesheet" href="global.css" />
  <link rel="stylesheet" href="index.css" />
  <style>
    .card-header-space { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .card-header-space h3 { margin: 0; font-size: 20px; }
    .card-header-space .subtitle { margin: 6px 0 0; color: var(--text-muted); font-size: 13px; max-width: 560px; }
    .table-wrapper { overflow-x: auto; }
    .table { width: 100%; border-collapse: collapse; min-width: 760px; }
    .table th, .table td { padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); text-align: left; font-size: 13px; }
    .table th { color: var(--text-muted); font-weight: 600; letter-spacing: 0.02em; }
    .table tbody tr:hover { background: rgba(255,255,255,0.04); }
    .table-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .table-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); color: white; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; transition: all 0.2s ease; }
    .table-btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.2); }
    .primary-btn { background: var(--primary); border-color: var(--primary); color: white; }
    .primary-btn:hover { background: var(--primary-hover); }
    .subtitle { display: block; }
    .modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal.hidden { display: none; }
    .modal-backdrop { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(6px); }
    .modal-panel { position: relative; width: min(560px, calc(100% - 32px)); background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 24px; box-shadow: 0 24px 48px rgba(0,0,0,0.4); z-index: 1; }
    .modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .modal-header h3 { margin: 0; font-size: 18px; }
    .modal-form .form-group { margin-bottom: 18px; }
    .modal-form label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
    .modal-form input { width: 100%; padding: 12px; border-radius: 10px; background: rgba(15, 23, 42, 0.7); border: 1px solid var(--card-border); color: white; }
    .modal-form input:focus { outline: none; border-color: var(--primary); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 8px; }
    .half-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .icon-btn { width: 38px; height: 38px; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; background: transparent; color: white; cursor: pointer; font-size: 22px; line-height: 1; }
    .icon-btn:hover { background: rgba(255,255,255,0.08); }
    @media (max-width: 720px) {
      .card-header-space { flex-direction: column; align-items: stretch; }
      .modal-panel { width: calc(100% - 24px); padding: 20px; }
      .half-grid { grid-template-columns: 1fr; }
      .table { min-width: 640px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <div class="topbar-title">账号管理</div>
    <div class="topbar-right">
      <a href="/" class="action-link">返回设备列表</a>
    </div>
  </header>

  <main class="page-shell">
    <section class="user-mgmt">
      <div class="card">
        <div class="card-header card-header-space">
          <div>
            <h3>账号列表</h3>
            <p class="subtitle">按角色、设备权限和有效期管理子账号，root 账号受保护</p>
          </div>
          <button id="addUserButton" class="action-btn">[ 新增用户 ]</button>
        </div>
        <div class="card-body">
          <div class="table-wrapper">
            <table id="usersTable" class="table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>用户名</th>
                  <th>角色</th>
                  <th>最大设备</th>
                  <th>到期时间</th>
                  <th>禁用</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <div id="usersPagination" class="pagination-bar"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="createUserModal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-panel">
      <div class="modal-header">
        <div>
          <h3>新增子账号</h3>
          <p class="subtitle">创建后可配置最大设备数与使用期限</p>
        </div>
        <button id="closeUserModal" type="button" class="icon-btn">×</button>
      </div>
      <form id="createUserForm" class="modal-form">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="newUsername" required />
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="text" id="newPassword" required />
        </div>
        <div class="form-group half-grid">
          <div>
            <label>最大设备数</label>
            <input type="number" id="newMaxDevices" value="5" />
          </div>
          <div>
            <label>有效天数</label>
            <input type="number" id="newDays" value="30" />
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" id="cancelCreateUser" class="action-btn">取消</button>
          <button type="submit" class="action-btn primary-btn">创建账号</button>
        </div>
      </form>
    </div>
  </div>

  <script src="users.js"></script>
</body>
</html>
